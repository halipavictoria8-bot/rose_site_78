      <h1 class="projet-titre"><span class="numero main">02</span><span class="titre-cap">Le champ spatial</span> <span class="nowrap">(Atelier 4)<span class="annee-titre main">2024</span></span></h1>
      <dl class="fiche">

      <li><a href="#ch-1"><span class="biffe"><span class="i">1.</span>Analyse du site</span></a></li>

  <!-- CHAPITRE 1 : Analyse du site -->
  <section class="p4-grille p4-chapitre" id="ch-1">
    <div class="p4-texte g" style="grid-row:1 / span 1">
      <h2 class="chapitre-nom"><span class="i">1.</span> Analyse du site</h2>
      <p>Cette analyse cartographique retrace l’évolution des contraintes environnementales et sociales ayant influencé les déplacements des Peuls entre 1950 et 2020 dans les régions de Waalo et de Jeeri au Sénégal. Dans les années 1950, les rythmes naturels, fondés sur des cycles climatiques relativement stables et lisibles, permettaient un nomadisme saisonnier prévisible, structuré par l’alternance des pluies, des crues et des périodes de&nbsp;sécheresse.</p>
        <p>Progressivement, l’intensification des aléas climatiques, combinée aux interventions anthropiques telles que l’expansion agricole, l’urbanisation et les conflits d’usage des terres, a rendu ces cycles de plus en plus imprévisibles. Cette perte de repères temporels et spatiaux a profondément modifié les pratiques de déplacement, entraînant une sédentarisation partielle autour des forages et des pôles&nbsp;économiques.</p>
        <p>Le territoire bascule ainsi d’un système fondé sur la prévisibilité des cycles naturels vers un paysage instable et incertain, appelant à des infrastructures capables de s’adapter à cette nouvelle condition&nbsp;d’imprévisibilité.</p>
    </div>
      <figure class="p4-img plan bord-d" style="grid-column:6 / span 7;grid-row:1;max-width:calc(var(--hmax) * 5.579)">

    <div class="p4-texte d" style="grid-row:1 / span 2">
      <h2 class="chapitre-nom"><span class="i">2.</span> Un potentiel dynamique</h2>
      <p>Le concept architectural s’inspire du mode de vie peul et de l’évolution de la transhumance, autrefois fondée sur des cycles prévisibles et aujourd’hui bouleversée par des contraintes naturelles et anthropiques rendant les déplacements&nbsp;incertains.</p>
        <p>Le projet propose une école du futur inscrite dans une trame spatiale dynamique, où des éléments fixes, ancrés dans la mémoire du territoire, coexistent avec des éléments mobiles soumis aux forces du vent, aux usages et aux mouvements des élèves. Un tissu architectural, tendu entre des poteaux, se déforme et se reconfigure en fonction des conditions du moment, générant des espaces temporaires, évolutifs et sensibles à leur&nbsp;environnement.</p>

      <h2 class="chapitre-nom"><span class="i">1.</span> Site analysis</h2>
      <p>This cartographic analysis traces the evolution of the environmental and social constraints that shaped the movements of the Fulani people between 1950 and 2020 in the Waalo and Jeeri regions of Senegal. In the 1950s, natural rhythms, based on relatively stable and legible climate cycles, allowed for a predictable seasonal nomadism, structured by the alternation of rains, floods and periods of&nbsp;drought.</p>
        <p>Gradually, the intensification of climate hazards, combined with human interventions such as agricultural expansion, urbanization and land-use conflicts, made these cycles increasingly unpredictable. This loss of temporal and spatial landmarks profoundly changed patterns of movement, leading to a partial settling around boreholes and economic&nbsp;hubs.</p>
        <p>The territory thus shifts from a system grounded in the predictability of natural cycles to an unstable and uncertain landscape, calling for infrastructure able to adapt to this new condition of&nbsp;unpredictability.</p>

      <h2 class="chapitre-nom"><span class="i">1.</span> Le projet</h2>
      <p>Implanté à l’Anse au Foulon, le Centre national du film du Québec s’inscrit dans un contexte marqué par l’histoire industrielle et portuaire du site. Le projet cherche à transformer cet héritage en un lieu de création accessible, où les espaces peuvent être appropriés et réinterprétés par les&nbsp;usagers.</p>
      <p>Une machine constructive qui assemble différents plans. Inspirée des typologies industrielles, l’architecture utilise des éléments simples et répétitifs pour structurer l’espace et révéler son&nbsp;histoire.</p>
      <p>Les anciens silos deviennent ainsi un terrain d’expérimentation et d’exploration, accueillant tournages, fabrication de décors, animation, photographie et projection. Plutôt qu’un bâtiment aux usages figés, le centre offre une structure capable d’évoluer selon les pratiques et les projets, où le public et les créateurs peuvent s’approprier les espaces et participer à la transformation du&nbsp;lieu.</p>

      <p>La maquette du projet a été réalisée à l’échelle 1:50 afin de représenter précisément la structure et l’organisation spatiale du Centre national du film du Québec. La fabrication s’est appuyée sur la modélisation et l’impression 3D, permettant de produire les différentes pièces structurelles avec précision, notamment les éléments répétitifs et les assemblages&nbsp;complexes.</p>

      <h2 class="chapitre-nom"><span class="i">1.</span> The project</h2>
      <p>Set at the Anse au Foulon, the Québec National Film Centre is part of a context shaped by the industrial and port history of the site. The project seeks to transform this heritage into an accessible place of creation, where spaces can be appropriated and reinterpreted by their&nbsp;users.</p>
      <p>A constructive machine that assembles different planes. Inspired by industrial typologies, the architecture uses simple, repetitive elements to structure the space and reveal its&nbsp;history.</p>
      <p>The former silos thus become a ground for experimentation and exploration, hosting film shoots, set building, animation, photography and screenings. Rather than a building with fixed uses, the centre offers a structure able to evolve with practices and projects, where the public and creators can make the spaces their own and take part in transforming the&nbsp;place.</p>
